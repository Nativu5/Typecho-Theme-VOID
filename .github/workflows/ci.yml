name: Build

on:
  push:
    branches:
      - self-use
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build
        run: make

      - name: Deploy Build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: nightly
          publish_dir: ./build
          # actions-gh-pages appends the source SHA itself
          commit_message: 'Automated deployment:'
